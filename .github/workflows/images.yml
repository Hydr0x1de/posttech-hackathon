name: Publish Docker images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/hydr0x1de/posttech-hackathon-api
  WEB_IMAGE: ghcr.io/hydr0x1de/posttech-hackathon-web
  DB_PRIMARY_URL: https://github.com/Hydr0x1de/posttech-hackathon/releases/download/v1.0/address_base.db
  DB_FALLBACK_URL: https://posttech_db.hydr0x1de.xyz/address_base.db

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download address base for image bake
        run: |
          set -euo pipefail
          mkdir -p backend/data
          if ! curl -fsSL --retry 5 --retry-delay 5 -o backend/data/address_base.db "$DB_PRIMARY_URL"; then
            echo "GitHub release unavailable, using mirror" >&2
            curl -fsSL --retry 5 --retry-delay 5 -o backend/data/address_base.db "$DB_FALLBACK_URL"
          fi
          test "$(head -c 15 backend/data/address_base.db)" = "SQLite format 3"
          ls -lh backend/data/address_base.db

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:1.0.0
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./jana-post-front
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:1.0.0
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
