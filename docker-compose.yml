name: jana-address

# Ready-to-run images with the address base baked in.
# Pull and start:  docker compose up -d
# Rebuild local images: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  api:
    image: ghcr.io/hydr0x1de/posttech-hackathon-api:1.0.0
    container_name: jana-address-api
    ports:
      - "8000:8000"
    environment:
      ADDRESS_DB_PATH: /data/address_base.db
      MAX_BATCH_SIZE: "5000"
      PARSER_WORKERS: "4"
      PARSER_CACHE_SIZE: "200000"
      DB_RELOAD_INTERVAL: "5"
      LOG_LEVEL: INFO
    healthcheck:
      # Baked-in DB must be loaded for the container to become healthy.
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          payload = json.load(
              urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
          )
          print(f"db_loaded={payload.get('db_loaded')}")
          healthy = payload.get("status") == "ok" and payload.get("db_loaded") is True
          sys.exit(0 if healthy else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/hydr0x1de/posttech-hackathon-web:1.0.0
    container_name: jana-address-web
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
